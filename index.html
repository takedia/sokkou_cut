<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>側溝切断角度計算（スマホ圧縮・カメラ付）</title>
<style>
  :root{--bg1:#667eea;--bg2:#764ba2;--panel:rgba(255,255,255,.10);--txt:#fff;--accent:#4CAF50;}
  *{box-sizing:border-box}
  body{margin:0;padding:10px;min-height:100vh;color:var(--txt);
       background:linear-gradient(135deg,var(--bg1),var(--bg2));
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;}
  .container{max-width:420px;margin:0 auto;background:var(--panel);backdrop-filter:blur(10px);
             border-radius:14px;padding:10px;box-shadow:0 10px 24px rgba(0,0,0,.2);}
  h1{font-size:16px;margin:0 0 6px}
  .panel{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
         border-radius:12px;padding:8px;margin-top:8px}
  #angleGuide{width:100%;aspect-ratio:4/3;background:rgba(0,0,0,.15);border-radius:10px;display:block;max-height:220px}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .inline{display:inline-flex;align-items:center;gap:4px;line-height:1}
  input[type="number"]{width:84px;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:#fff;color:#111;font-size:12px;}
  .result{background:#fff;color:#111;border-radius:10px;padding:6px;font-weight:700;text-align:center;
          display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .chip{background:rgba(0,0,0,.06);border-radius:8px;padding:4px 6px}
  .btn{appearance:none;border:none;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer;
       background:#fff;color:#333;box-shadow:0 1px 6px rgba(0,0,0,.15);font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .primary{background:var(--accent);color:#fff}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  input[type="range"]{flex:1;min-width:140px;height:30px;position:relative;z-index:1;background:transparent;-webkit-appearance:none}
  input[type="range"]::-webkit-slider-runnable-track{height:6px;background:#fff;border-radius:6px}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6px}
  input[type="range"]::-moz-range-track{height:6px;background:#fff;border-radius:6px}
  input[type="range"]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:none}
</style>
</head>
<body>
<div class="container">
  <h1>側溝切断角度計算</h1>

  <!-- ガイド -->
  <div class="panel" style="margin-top:0">
    <canvas id="angleGuide"></canvas>
  </div>

  <!-- 一行スライダー（数値表示なし / ラベル調整） -->
  <div class="panel">
    <div class="row">
      <span class="inline">L:</span>
      <input type="range" id="simpleLeftSlider" min="0" max="100" value="50" aria-label="左バー">
      <span class="inline">R:</span>
      <input type="range" id="simpleRightSlider" min="0" max="100" value="50" aria-label="右バー">
      <span class="inline">角度:<span id="simpleOpenDeg">90.0</span></span>
      <span class="inline">切断長:<span id="simpleCutLen" style="color:#4CAF50">0.0mm</span></span>
    </div>
    <div class="row" style="justify-content:center;font-size:12px;color:#eee;margin-top:4px">
      側溝幅:<span id="currentWidth">520</span>mm
    </div>
  </div>

  <!-- 入力 -->
  <div class="panel">
    <div class="row">
      θ/2(°):<input id="manualAngle" type="number" step="0.1" placeholder="例90">
      W(mm):<input id="productWidth" type="number" step="1" value="520">
      <button class="btn" id="directCalcBtn">計算</button>
    </div>
    <div class="result" style="margin-top:6px">
      <div class="chip">片側角:<span id="cutAngle">45.0</span>°</div>
      <div class="chip">切断長:<span id="cutLength">—</span></div>
    </div>
  </div>

  <!-- カメラ / 画像 -->
  <div class="panel">
    <div class="grid-2">
      <button class="btn" id="startCameraBtn">Cam</button>
      <button class="btn" id="stopBtn" disabled>Stop</button>
      <button class="btn" id="captureBtn" disabled>Shot</button>
      <label class="btn" style="text-align:center;cursor:pointer">
        Img<input id="imageInput" type="file" accept="image/*" style="display:none">
      </label>
    </div>
    <video id="video" playsinline style="width:100%;margin-top:6px;border-radius:10px;display:none"></video>
    <canvas id="photoCanvas" style="display:none"></canvas>
    <div class="grid-2" style="margin-top:6px">
      <button class="btn primary" id="useGuideAngleBtn">ガイド角で計算</button>
      <button class="btn" id="clearGuideBtn">ガイド消去</button>
    </div>
  </div>
</div>

<script>
let leftAngle=135.0,rightAngle=45.0,isCaptured=false,stream=null;
const guide=document.getElementById('angleGuide');
const gtx=guide.getContext('2d');const video=document.getElementById('video');const photo=document.getElementById('photoCanvas');

function fitCanvas(){const w=Math.round(guide.getBoundingClientRect().width);
  guide.width=w; guide.height=Math.round(w*3/4);
  if(isCaptured) drawCaptured(); drawGuide();}
window.addEventListener('resize',fitCanvas);

function drawGuide(){const W=guide.width,H=guide.height,cx=W/2,cy=H*0.35,r=Math.min(cx,cy)*1.8
  gtx.clearRect(0,0,W,H); if(isCaptured) drawCaptured();
  const lrad=leftAngle*Math.PI/180,rrad=rightAngle*Math.PI/180;
  const lx=cx+r*Math.cos(lrad),ly=cy+r*Math.sin(lrad);
  const rx=cx+r*Math.cos(rrad),ry=cy+r*Math.sin(rrad);
  gtx.strokeStyle='rgba(210,255,130,.95)'; gtx.lineWidth=2;
  gtx.beginPath(); gtx.moveTo(cx,cy); gtx.lineTo(lx,ly); gtx.stroke();
  gtx.beginPath(); gtx.moveTo(cx,cy); gtx.lineTo(rx,ry); gtx.stroke();
  gtx.fillStyle='rgba(210,255,130,.95)'; gtx.beginPath(); gtx.arc(cx,cy,4,0,Math.PI*2); gtx.fill();}

function getWidth(){return parseFloat(document.getElementById('productWidth').value)||520;}

function updateSimple(){
  const lv=+document.getElementById('simpleLeftSlider').value;
  const rv=+document.getElementById('simpleRightSlider').value;
  // 左は逆方向、右は従来どおり
  leftAngle=180-0.9*lv;  // 0→180°, 100→90°
  rightAngle=90-0.9*rv;  // 0→90°,  100→0°
  const open=Math.max(0,leftAngle-rightAngle);
  document.getElementById('simpleOpenDeg').textContent=open.toFixed(1);
  const w=getWidth(),cut=open/2;const len=open>0?w/Math.tan(cut*Math.PI/180):NaN;
  document.getElementById('simpleCutLen').textContent=isFinite(len)?(len.toFixed(1)+'mm'):'—';
  document.getElementById('manualAngle').value=open.toFixed(1);
  document.getElementById('currentWidth').textContent=String(w);
  drawGuide();
}

function validateInputs(angle,width){if(!(angle>0&&angle<180)){alert('角度は0～180');return false;}
  if(!(width>0)){alert('幅(mm)を入力');return false;}return true;}
function performCalculation(openAngle,width){
  const cut=openAngle/2,len=width/Math.tan(cut*Math.PI/180);
  document.getElementById('cutAngle').textContent=cut.toFixed(1);
  document.getElementById('cutLength').textContent=len.toFixed(1)+' mm';}
function calculateDirect(){const open=parseFloat(document.getElementById('manualAngle').value);
  const width=getWidth();if(!validateInputs(open,width))return;performCalculation(open,width);}
function useGuideAngle(){const width=getWidth();const open=Math.max(0,leftAngle-rightAngle);
  if(!validateInputs(open,width))return;performCalculation(open,width);}

async function startCamera(){try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  video.srcObject=stream; await video.play(); video.style.display='block';
  document.getElementById('startCameraBtn').disabled=true;
  document.getElementById('stopBtn').disabled=false; document.getElementById('captureBtn').disabled=false;
  isCaptured=false; fitCanvas();}catch(e){alert('カメラ開始不可:'+e.message);}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.pause();video.removeAttribute('srcObject');video.style.display='none';
  document.getElementById('startCameraBtn').disabled=false;
  document.getElementById('stopBtn').disabled=true;document.getElementById('captureBtn').disabled=true;}
function capturePhoto(){if(!video.videoWidth){alert('映像なし');return;}
  photo.width=guide.width;photo.height=guide.height;const p=photo.getContext('2d');
  const vw=video.videoWidth,vh=video.videoHeight,cw=photo.width,ch=photo.height;
  const vr=vw/vh,cr=cw/ch;let dw,dh,dx,dy;
  if(vr>cr){dh=ch;dw=dh*vr;dx=(cw-dw)/2;dy=0;}else{dw=cw;dh=dw/vr;dx=0;dy=(ch-dh)/2;}
  p.clearRect(0,0,cw,ch);p.drawImage(video,dx,dy,dw,dh);isCaptured=true;drawGuide();}
function drawCaptured(){if(photo.width&&photo.height){gtx.drawImage(photo,0,0,guide.width,guide.height);}}
function handleImageLoad(ev){const f=ev.target.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{photo.width=guide.width;photo.height=guide.height;const p=photo.getContext('2d');
  const iw=img.width,ih=img.height,cw=photo.width,ch=photo.height;const ir=iw/ih,cr=cw/ch;let dw,dh,dx,dy;
  if(ir>cr){dh=ch;dw=dh*ir;dx=(cw-dw)/2;dy=0;}else{dw=cw;dh=dw/ir;dx=0;dy=(ch-dh)/2;}
  p.clearRect(0,0,cw,ch);p.drawImage(img,dx,dy,dw,dh);isCaptured=true;drawGuide();};
  img.src=URL.createObjectURL(f);}
function clearGuide(){isCaptured=false;photo.width=photo.height=0;drawGuide();}

function setup(){
  fitCanvas();
  document.getElementById('simpleLeftSlider').addEventListener('input',updateSimple,{passive:true});
  document.getElementById('simpleRightSlider').addEventListener('input',updateSimple,{passive:true});
  document.getElementById('productWidth').addEventListener('input',updateSimple,{passive:true});
  document.getElementById('directCalcBtn').addEventListener('click',calculateDirect);
  document.getElementById('useGuideAngleBtn').addEventListener('click',useGuideAngle);
  document.getElementById('startCameraBtn').addEventListener('click',startCamera);
  document.getElementById('stopBtn').addEventListener('click',stopCamera);
  document.getElementById('captureBtn').addEventListener('click',capturePhoto);
  document.getElementById('imageInput').addEventListener('change',handleImageLoad);
  document.getElementById('clearGuideBtn').addEventListener('click',clearGuide);
  updateSimple(); performCalculation(90,getWidth());
}
document.addEventListener('DOMContentLoaded',setup);
</script>
</body>
</html>
