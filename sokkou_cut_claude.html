<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>側溝切断角度計算アプリ - 完全版</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
            font-weight: 300;
        }
        
        .version {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            font-style: italic;
        }
        
        .input-section {
            margin: 20px 0;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 16px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        
        /* カメラモード */
        .video-container {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        #video {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .angle-guide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.8;
        }
        
        .angle-control {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        
        .angle-slider {
            width: 100%;
            margin: 10px 0;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(90deg, #FF5722, #FF9800, #4CAF50, #2196F3, #9C27B0);
            outline: none;
        }
        
        .angle-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #4CAF50;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        .angle-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #4CAF50;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        .angle-value {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
            margin: 5px 0;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .calc-button {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .calc-button:hover {
            background: linear-gradient(45deg, #45a049, #4CAF50);
            transform: translateY(-2px);
        }
        
        /* 結果表示 */
        .result {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: center;
            border: 3px solid #4CAF50;
        }
        
        .result h3 {
            margin-top: 0;
            color: #4CAF50;
            font-size: 18px;
        }
        
        .result-item {
            margin: 15px 0;
            padding: 10px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 8px;
        }
        
        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            margin: 5px 0;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
        }
        
        .error {
            background: rgba(255, 87, 87, 0.9);
            color: white;
        }
        
        .success {
            background: rgba(76, 175, 80, 0.9);
            color: white;
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 側溝切断角度計算アプリ</h1>
        <div class="version">Version 2.2.1 - Simple Guide Edition</div>
        
        <div class="instructions">
            <strong>使い方：</strong><br>
            📐 <strong>直接入力</strong>：角度と幅を入力するだけ<br>
            📷 <strong>角度ガイド</strong>：カメラで角度を合わせて測定<br><br>
            <div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 10px;">
                💡 スライダーで角度を調整すると、リアルタイムで切断長さが表示されます
            </div>
        </div>
        
        <!-- 直接入力セクション -->
        <div class="input-section">
            <label for="manualAngle">📐 曲げる角度 (度)</label>
            <input type="number" id="manualAngle" placeholder="例: 135" step="0.1" min="1" max="179">
        </div>
        
        <div class="input-section">
            <label for="productWidth">📏 製品の幅 (cm)</label>
            <input type="number" id="productWidth" placeholder="例: 57" value="57" step="0.1" min="0.1">
        </div>
        
        <button class="calc-button" id="directCalcBtn">
            🧮 計算する
        </button>
        
        <!-- カメラ角度ガイドセクション -->
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
            <h3 style="text-align: center; margin-bottom: 15px;">📷 カメラ角度ガイド</h3>
            
            <div class="video-container">
                <video id="video" style="display: none;"></video>
                <canvas id="angleGuide" class="angle-guide" style="display: none;"></canvas>
            </div>
            
            <!-- 角度調整スライダー -->
            <div id="angleControl" class="angle-control" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <div>目標角度: <span class="angle-value" id="targetAngle">135°</span></div>
                    <div style="font-size: 14px; color: #333;">
                        切断長さ: <span style="font-weight: bold; color: #4CAF50;" id="realtimeCutLength">23.6cm</span>
                    </div>
                </div>
                <input type="range" id="angleSlider" class="angle-slider" min="30" max="170" value="135" step="1">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 5px;">
                    <span>30°</span>
                    <span>90°</span>
                    <span>135°</span>
                    <span>170°</span>
                </div>
                <div style="font-size: 12px; color: #666; margin-top: 5px; text-align: center;">
                    製品幅: <span id="currentWidth">57</span>cm での計算
                </div>
            </div>
            
            <div class="controls">
                <button id="startCameraBtn">📷 カメラ起動</button>
                <button id="stopBtn" disabled>⏹️ 停止</button>
                <button id="useGuideAngleBtn" disabled style="background: linear-gradient(45deg, #4CAF50, #45a049);">📐 この角度で計算</button>
            </div>
        </div>
        
        <!-- ステータス表示 -->
        <div id="status" class="status" style="display: none;"></div>
        
        <!-- 結果表示 -->
        <div id="result" class="result" style="display: none;">
            <h3>📋 計算結果</h3>
            <div class="result-item">
                <strong>切断角度:</strong>
                <div class="result-value" id="cutAngle">---°</div>
            </div>
            <div class="result-item">
                <strong>切断する長さ:</strong>
                <div class="result-value" id="cutLength">--- cm</div>
            </div>
        </div>
    </div>

    <script>
        // グローバル変数
        const APP_VERSION = "2.2.1";
        const VERSION_NAME = "Simple Guide Edition";
        const BUILD_DATE = "2024-12-19";
        
        let video, angleGuideCanvas, angleGuideCtx;
        let stream = null;
        let targetAngle = 135;

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            console.log(`🚀 側溝切断角度計算アプリ v${APP_VERSION} (${VERSION_NAME}) が読み込まれました！`);
            
            // 要素の取得
            video = document.getElementById('video');
            angleGuideCanvas = document.getElementById('angleGuide');
            angleGuideCtx = angleGuideCanvas.getContext('2d');
            
            // Canvasのサイズ設定
            angleGuideCanvas.width = angleGuideCanvas.offsetWidth;
            angleGuideCanvas.height = angleGuideCanvas.offsetHeight;
            
            // イベントリスナーの設定
            setupEventListeners();
            
            // リアルタイム表示の初期化
            updateRealtimeDisplay();
        });

        // イベントリスナー設定
        function setupEventListeners() {
            // 直接計算ボタン
            document.getElementById('directCalcBtn').addEventListener('click', calculateDirect);
            
            // カメラ操作ボタン
            document.getElementById('startCameraBtn').addEventListener('click', startCamera);
            document.getElementById('stopBtn').addEventListener('click', stopCamera);
            document.getElementById('useGuideAngleBtn').addEventListener('click', useGuideAngle);
            
            // 角度スライダー
            document.getElementById('angleSlider').addEventListener('input', updateTargetAngle);
            
            // 入力フィールドでのリアルタイム計算
            document.getElementById('manualAngle').addEventListener('input', calculateDirect);
            document.getElementById('productWidth').addEventListener('input', function() {
                updateRealtimeDisplay();
                if (document.getElementById('manualAngle').value) {
                    calculateDirect();
                }
            });
        }

        // 直接計算
        function calculateDirect() {
            console.log('🧮 直接計算開始');
            
            const angle = parseFloat(document.getElementById('manualAngle').value);
            const width = parseFloat(document.getElementById('productWidth').value);
            
            if (!validateInputs(angle, width)) return;
            
            performCalculation(angle, width);
        }

        // ガイド角度で計算
        function useGuideAngle() {
            console.log('🧮 ガイド角度で計算開始');
            
            const width = parseFloat(document.getElementById('productWidth').value) || 57;
            
            if (!validateInputs(targetAngle, width)) return;
            
            performCalculation(targetAngle, width);
        }

        // 入力値検証
        function validateInputs(angle, width) {
            if (!angle || isNaN(angle)) {
                showStatus('❌ 角度を入力してください（例: 135）', 'error');
                return false;
            }
            
            if (!width || isNaN(width)) {
                showStatus('❌ 製品幅を入力してください（例: 57）', 'error');
                return false;
            }
            
            if (angle <= 0 || angle >= 180) {
                showStatus('❌ 角度は1°〜179°の範囲で入力してください', 'error');
                return false;
            }
            
            if (width <= 0) {
                showStatus('❌ 製品幅は0より大きい値を入力してください', 'error');
                return false;
            }
            
            return true;
        }

        // 計算実行
        function performCalculation(angle, width) {
            try {
                showStatus('🔄 計算中...', 'info');
                
                // 切断角度の計算
                const halfAngle = (180 - angle) / 2;
                const cutAngle = 90 - halfAngle;
                
                // 切断長さの計算
                const cutAngleRad = (cutAngle * Math.PI) / 180;
                const tanValue = Math.tan(cutAngleRad);
                const cutLength = width / tanValue;
                
                console.log('📐 計算結果 - 切断角度:', cutAngle, '切断長さ:', cutLength);
                
                // 結果表示
                document.getElementById('cutAngle').textContent = cutAngle.toFixed(1) + '°';
                document.getElementById('cutLength').textContent = cutLength.toFixed(1) + ' cm';
                
                showResult();
                showStatus('✅ 計算完了！', 'success');
                
            } catch (error) {
                console.error('💥 計算エラー:', error);
                showStatus('❌ 計算エラーが発生しました', 'error');
            }
        }

        // カメラ機能
        async function startCamera() {
            console.log('📷 カメラ起動試行');
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                await video.play();
                
                // 角度ガイドキャンバスも表示
                angleGuideCanvas.style.display = 'block';
                document.getElementById('angleControl').style.display = 'block';
                
                resizeAngleGuideCanvas();
                
                // 角度ガイドを自動で表示
                drawAngleGuide();
                
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('useGuideAngleBtn').disabled = false;
                
                // リアルタイム表示を初期化
                updateRealtimeDisplay();
                
                showStatus('📷 カメラが起動しました。緑の線に合わせて角度を調整してください', 'success');
                
            } catch (error) {
                console.error('カメラエラー:', error);
                
                let errorMessage = 'カメラにアクセスできません: ';
                if (error.name === 'NotAllowedError') {
                    errorMessage += 'カメラの使用が許可されていません。ブラウザの設定でカメラを許可してください。';
                } else {
                    errorMessage += error.message;
                }
                
                showStatus('❌ ' + errorMessage, 'error');
            }
        }

        function stopCamera() {
            console.log('⏹️ カメラ停止');
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            video.style.display = 'none';
            angleGuideCanvas.style.display = 'none';
            document.getElementById('angleControl').style.display = 'none';
            
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('useGuideAngleBtn').disabled = true;
            
            showStatus('⏹️ カメラを停止しました', 'info');
        }

        // 角度ガイドを描画
        function drawAngleGuide() {
            const centerX = angleGuideCanvas.width / 2;
            const centerY = angleGuideCanvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.6;
            
            angleGuideCtx.clearRect(0, 0, angleGuideCanvas.width, angleGuideCanvas.height);
            
            // 目標角度のラインを描画
            const startAngle = (180 - targetAngle) / 2;
            const endAngle = startAngle + targetAngle;
            
            // 角度の線（太い線）
            angleGuideCtx.strokeStyle = 'rgba(76, 175, 80, 0.9)';
            angleGuideCtx.lineWidth = 4;
            angleGuideCtx.lineCap = 'round';
            
            // 左の線
            const leftRadian = (startAngle * Math.PI) / 180;
            const leftX = centerX + radius * Math.cos(leftRadian);
            const leftY = centerY + radius * Math.sin(leftRadian);
            
            angleGuideCtx.beginPath();
            angleGuideCtx.moveTo(centerX, centerY);
            angleGuideCtx.lineTo(leftX, leftY);
            angleGuideCtx.stroke();
            
            // 右の線
            const rightRadian = (endAngle * Math.PI) / 180;
            const rightX = centerX + radius * Math.cos(rightRadian);
            const rightY = centerY + radius * Math.sin(rightRadian);
            
            angleGuideCtx.beginPath();
            angleGuideCtx.moveTo(centerX, centerY);
            angleGuideCtx.lineTo(rightX, rightY);
            angleGuideCtx.stroke();
            
            // 角度の弧を描画
            angleGuideCtx.strokeStyle = 'rgba(76, 175, 80, 0.7)';
            angleGuideCtx.lineWidth = 2;
            angleGuideCtx.beginPath();
            angleGuideCtx.arc(centerX, centerY, radius * 0.7, leftRadian, rightRadian);
            angleGuideCtx.stroke();
            
            // 中心点
            angleGuideCtx.fillStyle = 'rgba(76, 175, 80, 0.9)';
            angleGuideCtx.beginPath();
            angleGuideCtx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
            angleGuideCtx.fill();
            
            // 角度ラベル
            angleGuideCtx.fillStyle = 'rgba(76, 175, 80, 0.9)';
            angleGuideCtx.font = 'bold 16px Arial';
            angleGuideCtx.textAlign = 'center';
            angleGuideCtx.fillText(targetAngle + '°', centerX, centerY - radius * 0.8);
            
            // 使用説明
            angleGuideCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            angleGuideCtx.font = '12px Arial';
            angleGuideCtx.fillText('緑の線に合わせてください', centerX, angleGuideCanvas.height - 20);
        }

        // 目標角度の更新
        function updateTargetAngle() {
            targetAngle = parseInt(document.getElementById('angleSlider').value);
            document.getElementById('targetAngle').textContent = targetAngle + '°';
            
            drawAngleGuide();
            updateRealtimeDisplay();
        }
        
        // リアルタイム切断長さ表示の更新
        function updateRealtimeDisplay() {
            const width = parseFloat(document.getElementById('productWidth').value) || 57;
            
            try {
                // 切断角度の計算
                const halfAngle = (180 - targetAngle) / 2;
                const cutAngle = 90 - halfAngle;
                
                // 切断長さの計算
                const cutAngleRad = (cutAngle * Math.PI) / 180;
                const tanValue = Math.tan(cutAngleRad);
                const cutLength = width / tanValue;
                
                // リアルタイム表示を更新
                document.getElementById('realtimeCutLength').textContent = cutLength.toFixed(1) + 'cm';
                document.getElementById('currentWidth').textContent = width.toString();
                
            } catch (error) {
                document.getElementById('realtimeCutLength').textContent = '---cm';
                console.error('リアルタイム計算エラー:', error);
            }
        }

        // 角度ガイドキャンバスのサイズ調整
        function resizeAngleGuideCanvas() {
            const rect = video.getBoundingClientRect();
            angleGuideCanvas.width = rect.width;
            angleGuideCanvas.height = rect.height;
            drawAngleGuide();
        }

        // ユーティリティ関数
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
            console.log('📢 ステータス:', message);
            
            if (type === 'success') {
                setTimeout(() => {
                    hideStatus();
                }, 3000);
            }
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        function showResult() {
            document.getElementById('result').style.display = 'block';
        }

        function hideResult() {
            document.getElementById('result').style.display = 'none';
        }

        // バージョン情報を表示（開発者用）
        function showVersionInfo() {
            const versionInfo = {
                version: APP_VERSION,
                name: VERSION_NAME,
                buildDate: BUILD_DATE,
                features: [
                    "直接角度入力計算",
                    "リアルタイム角度ガイド",
                    "切断長さ即時計算",
                    "カメラプレビュー機能",
                    "簡単操作"
                ],
                changelog: {
                    "2.2.1": [
                        "シンプルで確実な角度ガイド機能に統一",
                        "複雑な線描画機能を削除",
                        "カメラ角度ガイドに特化",
                        "操作性を大幅改善"
                    ]
                },
                author: "Pipe Angle Calculator Team",
                license: "MIT License"
            };
            
            console.table(versionInfo.features);
            console.log("📋 Version Info:", versionInfo);
            console.log("🔄 Changelog:", versionInfo.changelog);
            
            return versionInfo;
        }

        // グローバル関数として公開（デバッグ用）
        window.showVersionInfo = showVersionInfo;
    </script>
</body>
</html>
