<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="11">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c8c2c"/>
    </marker>
    <marker id="ago" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a4a10"/>
    </marker>
  </defs>

  <text x="210" y="18" text-anchor="middle" font-weight="700" font-size="13" fill="#222">基本操作の流れ</text>

  <!-- Smartphone outline -->
  <rect x="125" y="30" width="170" height="250" fill="#fff" stroke="#333" stroke-width="2" rx="14"/>
  <rect x="135" y="42" width="150" height="6" fill="#ddd" rx="3"/>

  <!-- Canvas area in phone (with simplified V lines) -->
  <rect x="135" y="56" width="150" height="100" fill="#3a3357" rx="6"/>
  <line x1="210" y1="76" x2="160" y2="146" stroke="#caff7d" stroke-width="2"/>
  <line x1="210" y1="76" x2="260" y2="146" stroke="#caff7d" stroke-width="2"/>
  <!-- Inset suggestion -->
  <rect x="142" y="124" width="50" height="28" fill="#000" opacity="0.55"/>
  <text x="167" y="138" text-anchor="middle" fill="#fff" font-size="7">ケガキ図</text>
  <text x="167" y="148" text-anchor="middle" fill="#ffeb50" font-size="7">215mm</text>

  <!-- Mode toggle + cut len pill -->
  <rect x="142" y="166" width="36" height="14" fill="#4CAF50" rx="7"/>
  <text x="160" y="176" text-anchor="middle" fill="#fff" font-size="8">両側</text>
  <rect x="220" y="166" width="60" height="14" fill="#fff" stroke="#ccc" rx="7"/>
  <text x="250" y="176" text-anchor="middle" font-size="8" fill="#333">切断 215mm</text>

  <!-- Sliders（横1列） -->
  <line x1="145" y1="194" x2="206" y2="194" stroke="#bbb" stroke-width="4"/>
  <circle cx="172" cy="194" r="5" fill="#4CAF50"/>
  <line x1="217" y1="194" x2="278" y2="194" stroke="#bbb" stroke-width="4"/>
  <circle cx="255" cy="194" r="5" fill="#4CAF50"/>

  <!-- ずらし値 行（面取り・底面用） -->
  <rect x="142" y="207" width="46" height="14" fill="#fff" stroke="#ccc" rx="3"/>
  <text x="165" y="217" text-anchor="middle" font-size="7" fill="#333">面の横幅</text>
  <text x="236" y="217" text-anchor="middle" font-size="8" fill="#9a4a10" font-weight="700">→ ずらし値 △mm</text>

  <!-- Buttons row -->
  <rect x="142" y="232" width="36" height="14" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="160" y="242" text-anchor="middle" font-size="7" fill="#333">カメラ</text>
  <rect x="180" y="232" width="34" height="14" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="197" y="242" text-anchor="middle" font-size="7" fill="#333">撮影</text>
  <rect x="216" y="232" width="34" height="14" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="233" y="242" text-anchor="middle" font-size="7" fill="#333">読込</text>
  <rect x="252" y="232" width="28" height="14" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="266" y="242" text-anchor="middle" font-size="7" fill="#333">ログ</text>

  <!-- Step annotations with arrows -->
  <!-- 1. Camera -->
  <text x="50" y="245" font-weight="700" fill="#2c8c2c">①</text>
  <text x="22" y="259" fill="#222" font-size="10">カメラ起動</text>
  <text x="22" y="271" fill="#666" font-size="9">or 画像読込</text>
  <line x1="75" y1="240" x2="138" y2="238" stroke="#2c8c2c" stroke-width="1.2" marker-end="url(#ag)"/>

  <!-- 2. Mode toggle -->
  <text x="50" y="175" font-weight="700" fill="#2c8c2c">②</text>
  <text x="14" y="189" fill="#222" font-size="10">両側 / 片側</text>
  <text x="14" y="201" fill="#666" font-size="9">の選択</text>
  <line x1="75" y1="175" x2="138" y2="173" stroke="#2c8c2c" stroke-width="1.2" marker-end="url(#ag)"/>

  <!-- 3. Slider/drag -->
  <text x="50" y="208" font-weight="700" fill="#2c8c2c">③</text>
  <text x="13" y="222" fill="#222" font-size="10">スライダー</text>
  <text x="13" y="232" fill="#666" font-size="9">or 図ドラッグ</text>
  <line x1="75" y1="214" x2="138" y2="195" stroke="#2c8c2c" stroke-width="1.2" marker-end="url(#ag)"/>

  <!-- 4. Read cut length -->
  <text x="320" y="135" font-weight="700" fill="#2c8c2c">④</text>
  <text x="318" y="149" fill="#222" font-size="10">切断長を</text>
  <text x="318" y="161" fill="#222" font-size="10">読み取り</text>
  <text x="318" y="175" fill="#666" font-size="9">タップで詳細</text>
  <line x1="316" y1="140" x2="200" y2="140" stroke="#2c8c2c" stroke-width="1.2" marker-end="url(#ag)"/>

  <!-- 5. ずらし値（面取り・底面用） -->
  <text x="322" y="205" font-weight="700" fill="#9a4a10">⑤</text>
  <text x="312" y="219" fill="#222" font-size="9">面のずらし値</text>
  <text x="312" y="230" fill="#666" font-size="8">（厳密時・任意）</text>
  <line x1="310" y1="214" x2="284" y2="214" stroke="#9a4a10" stroke-width="1.2" marker-end="url(#ago)"/>
</svg>
