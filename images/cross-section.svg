<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="11">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d67a2a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7fc0"/>
    </marker>
  </defs>

  <text x="210" y="18" text-anchor="middle" font-weight="700" font-size="13" fill="#222">横断方向（コーナー）— 上から見た図</text>

  <!--
    Geometry: apex(210,55), body angle ±22.5° from horizontal.
    Each piece drawn as a PROPER PARALLELOGRAM (all parallel sides).
    Wedge (red triangle) shows the part that's actually cut off for the miter joint.
    Left body unit: (-0.924, 0.383)   Perp: (0.383, 0.924)
    W=38, L=140, disp=15.74  (openAngle=135°, miterHalf=67.5°)
    Left outer rect:  (210,55), (224.55,90.11), (95.19,143.73), (80.64,108.62)
    Left channel rect (tOut=0.22, tIn=0.78):
                      (213.20,62.72), (221.35,82.39), (91.99,136.01), (83.84,116.34)
    Left wedge tri:   (210,55), (224.55,90.11), (210.01,96.14)
    Right is mirror across x=210.
  -->

  <!-- LEFT GUTTER -->
  <polygon points="210,55 224.55,90.11 95.19,143.73 80.64,108.62" fill="#dadada" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="213.20,62.72 221.35,82.39 91.99,136.01 83.84,116.34" fill="#3a3a3a" opacity="0.55"/>
  <polygon points="210,55 224.55,90.11 210.01,96.14" fill="#cc2c2c" opacity="0.3" stroke="#cc2c2c" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- RIGHT GUTTER -->
  <polygon points="210,55 195.45,90.11 324.81,143.73 339.36,108.62" fill="#dadada" stroke="#1a1a1a" stroke-width="1.4"/>
  <polygon points="206.80,62.72 198.65,82.39 328.01,136.01 336.16,116.34" fill="#3a3a3a" opacity="0.55"/>
  <polygon points="210,55 195.45,90.11 209.99,96.14" fill="#cc2c2c" opacity="0.3" stroke="#cc2c2c" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Cut line (the miter cut, shared by both pieces - vertical down from apex) -->
  <line x1="210" y1="55" x2="210" y2="96.14" stroke="#2c8c2c" stroke-width="2.6"/>

  <!-- Apex marker -->
  <circle cx="210" cy="55" r="3" fill="#cc2c2c"/>
  <text x="210" y="48" text-anchor="middle" fill="#666" font-size="10">頂点（外側コーナー）</text>

  <!-- Cut length dimension -->
  <line x1="245" y1="55" x2="245" y2="96.14" stroke="#d67a2a" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="252" y="68" width="110" height="16" fill="#fff7ed" stroke="#d67a2a" stroke-width="0.6" rx="3"/>
  <text x="307" y="79" text-anchor="middle" font-weight="700" fill="#9a4a10" font-size="11">切断長 = W/tan(θ/2)</text>

  <!-- Width dimension on far end of left strip (perpendicular short side) -->
  <line x1="60" y1="118" x2="86" y2="151" stroke="#3a7fc0" stroke-width="1.2" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="50" y="137" fill="#3a7fc0" font-weight="700" font-size="11">幅 W</text>

  <!-- Angle θ arc at apex (quadratic bezier bulging down through V opening) -->
  <path d="M228.5,62.7 Q210,82 191.5,62.7" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="210" y="80" text-anchor="middle" fill="#333" font-weight="700">θ</text>

  <!-- Legend -->
  <rect x="295" y="148" width="10" height="10" fill="#cc2c2c" opacity="0.3" stroke="#cc2c2c" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="310" y="157" font-size="10" fill="#444">切除する部分</text>

  <!-- Bottom annotations -->
  <text x="210" y="188" text-anchor="middle" fill="#222" font-size="12">開き角 θ を読み取り、切断長を算出</text>
  <text x="210" y="208" text-anchor="middle" fill="#666" font-size="10">例: W=520mm, θ=135° → 切断長 ≈ 215mm</text>
  <text x="210" y="226" text-anchor="middle" fill="#666" font-size="10">赤い部分（ウェッジ）を切り落として2片を接合します</text>
</svg>
