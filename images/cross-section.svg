<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="11">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d67a2a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7fc0"/>
    </marker>
  </defs>

  <text x="210" y="18" text-anchor="middle" font-weight="700" font-size="13" fill="#222">横断方向（コーナー）— 上から見た図</text>

  <!-- Geometry: apex(210,55), body angle ±22.5° from horizontal, W=38, L=140, miter half=67.5°, disp=15.7
       Left strip outer: cON(210,55), cIN(210,96), cIF(95,144), cOF(81,109)
       Left channel (tOut=0.22, tIn=0.78 along cut/far edges):
         chON(210.01,64), chIN(210.03,87), chIF(92,136), chOF(84,117)
       Right is mirror of left across x=210. -->

  <!-- Left gutter outer (parallelogram with miter cut on near edge) -->
  <polygon points="210,55 210,96 95,144 81,109" fill="#dadada" stroke="#1a1a1a" stroke-width="1.4"/>
  <!-- Left channel (parallel to outer body axis) -->
  <polygon points="210,64 210,87 92,136 84,117" fill="#3a3a3a" opacity="0.55"/>

  <!-- Right gutter outer (mirror) -->
  <polygon points="210,55 210,96 325,144 339,109" fill="#dadada" stroke="#1a1a1a" stroke-width="1.4"/>
  <!-- Right channel (mirror) -->
  <polygon points="210,64 210,87 328,136 336,117" fill="#3a3a3a" opacity="0.55"/>

  <!-- Cut/seam line from apex down bisector -->
  <line x1="210" y1="55" x2="210" y2="96" stroke="#2c8c2c" stroke-width="2.6"/>

  <!-- Apex marker -->
  <circle cx="210" cy="55" r="3" fill="#cc2c2c"/>
  <text x="210" y="48" text-anchor="middle" fill="#666" font-size="10">頂点（外側コーナー）</text>

  <!-- Cut length dimension (orange, to the right of seam) -->
  <line x1="220" y1="55" x2="220" y2="96" stroke="#d67a2a" stroke-width="1.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="227" y="68" width="106" height="16" fill="#fff7ed" stroke="#d67a2a" stroke-width="0.6" rx="3"/>
  <text x="280" y="79" text-anchor="middle" font-weight="700" fill="#9a4a10" font-size="11">切断長 = W/tan(θ/2)</text>

  <!-- Width dimension on the far end of left gutter -->
  <line x1="60" y1="118" x2="86" y2="151" stroke="#3a7fc0" stroke-width="1.2" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="50" y="137" fill="#3a7fc0" font-weight="700" font-size="11">幅 W</text>

  <!-- Angle θ arc at apex -->
  <path d="M196,74 A18,18 0 0 0 224,74" fill="none" stroke="#555" stroke-width="1.2"/>
  <text x="210" y="84" text-anchor="middle" fill="#333" font-weight="700">θ</text>

  <!-- Bottom annotations -->
  <text x="210" y="198" text-anchor="middle" fill="#222" font-size="12">開き角 θ を読み取り、切断長を算出</text>
  <text x="210" y="218" text-anchor="middle" fill="#666" font-size="10">例: W=520mm, θ=135° → 切断長 ≈ 215mm</text>
  <text x="210" y="236" text-anchor="middle" fill="#666" font-size="10">2片を同じ角度で切ると接合面がきれいに合います</text>
</svg>
