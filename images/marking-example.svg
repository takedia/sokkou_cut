<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="11">
  <defs>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d67a2a"/>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7fc0"/>
    </marker>
  </defs>

  <text x="210" y="18" text-anchor="middle" font-weight="700" font-size="13" fill="#222">ケガキの実例（拡大）</text>

  <!-- Big piece rectangle (top view) -->
  <rect x="40" y="50" width="320" height="90" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.6"/>
  <!-- Inner channel -->
  <rect x="50" y="70" width="300" height="50" fill="#444" opacity="0.45"/>
  <!-- Outer outline -->
  <rect x="40" y="50" width="320" height="90" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>

  <!-- Cut line (slanted at right end) -->
  <line x1="360" y1="50" x2="280" y2="140" stroke="#2c8c2c" stroke-width="3"/>

  <!-- Cut mark dots -->
  <circle cx="360" cy="50" r="3" fill="#2c8c2c"/>
  <circle cx="280" cy="140" r="3" fill="#2c8c2c"/>

  <!-- Tick marks showing measurements -->
  <line x1="360" y1="46" x2="360" y2="54" stroke="#d67a2a" stroke-width="1.4"/>
  <line x1="280" y1="136" x2="280" y2="144" stroke="#d67a2a" stroke-width="1.4"/>

  <!-- Wedge (to be removed) -->
  <polygon points="360,50 360,140 280,140" fill="#ef4444" opacity="0.2"/>
  <text x="335" y="115" fill="#cc2c2c" font-weight="700" font-size="11">切除</text>

  <!-- Cut length dimension on bottom edge -->
  <line x1="280" y1="160" x2="360" y2="160" stroke="#d67a2a" stroke-width="1.2" marker-start="url(#am)" marker-end="url(#am)"/>
  <rect x="293" y="167" width="54" height="16" fill="#fff7ed" stroke="#d67a2a" stroke-width="0.6" rx="3"/>
  <text x="320" y="178" text-anchor="middle" fill="#9a4a10" font-weight="700">cutLen mm</text>

  <!-- Width dimension on left edge -->
  <line x1="25" y1="50" x2="25" y2="140" stroke="#3a7fc0" stroke-width="1.2" marker-start="url(#ax)" marker-end="url(#ax)"/>
  <text x="14" y="98" fill="#3a7fc0" font-weight="700">幅 W</text>

  <!-- Caution note -->
  <rect x="50" y="200" width="320" height="64" fill="#fff7ed" stroke="#d67a2a" stroke-width="0.8" rx="6"/>
  <text x="60" y="220" fill="#9a4a10" font-weight="700" font-size="12">⚠️ ケガキの注意</text>
  <text x="60" y="238" fill="#7c2d12" font-size="11">・実物の切断は数mm〜1cm余裕を持ってケガく</text>
  <text x="60" y="252" fill="#7c2d12" font-size="11">・切断後に目地（モルタル等）で微調整</text>
</svg>
