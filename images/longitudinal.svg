<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="11">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d67a2a"/>
    </marker>
    <marker id="ab2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a7fc0"/>
    </marker>
  </defs>

  <text x="210" y="18" text-anchor="middle" font-weight="700" font-size="13" fill="#222">縦断方向 — 横から見た図（勾配/方向の調整）</text>

  <!-- Gutter side view: rectangle with angled cut at right end -->
  <!-- Original outline -->
  <polygon points="40,80 360,80 360,140 40,140" fill="#eee" stroke="#888" stroke-width="0.6" stroke-dasharray="3,2"/>
  <!-- Actual remaining piece after cut -->
  <polygon points="40,80 360,80 290,140 40,140" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="1.4"/>
  <!-- Channel area -->
  <rect x="48" y="100" width="240" height="22" fill="#444" opacity="0.45"/>

  <!-- Cut line (highlighted) -->
  <line x1="360" y1="80" x2="290" y2="140" stroke="#2c8c2c" stroke-width="2.6"/>

  <!-- Cut wedge (removed part, shown as light red) -->
  <polygon points="360,80 360,140 290,140" fill="#ef4444" opacity="0.2" stroke="#cc2c2c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Cut length dimension (horizontal, below piece) -->
  <line x1="290" y1="160" x2="360" y2="160" stroke="#d67a2a" stroke-width="1.2" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  <text x="325" y="174" text-anchor="middle" fill="#9a4a10" font-weight="700" font-size="11">切断長</text>

  <!-- Height (W) dimension on left side -->
  <line x1="25" y1="80" x2="25" y2="140" stroke="#3a7fc0" stroke-width="1.2" marker-start="url(#ab2)" marker-end="url(#ab2)"/>
  <text x="12" y="113" fill="#3a7fc0" font-weight="700" font-size="11">高さ W</text>

  <!-- Center line -->
  <line x1="40" y1="110" x2="320" y2="110" stroke="#cc2c2c" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Labels -->
  <text x="200" y="65" text-anchor="middle" fill="#666" font-size="10">原形（破線）</text>
  <text x="375" y="105" text-anchor="middle" fill="#cc2c2c" font-size="10">切除</text>
  <text x="280" y="100" fill="#2c8c2c" font-weight="700" font-size="11">カット</text>

  <!-- Bottom note -->
  <text x="210" y="208" text-anchor="middle" fill="#222" font-size="12">勾配や方向変化に合わせて端部を角度カット</text>
  <text x="210" y="226" text-anchor="middle" fill="#666" font-size="10">片側モードでも 横断と同じ計算式（W ÷ tan(|θ-90°|)）</text>
  <text x="210" y="244" text-anchor="middle" fill="#666" font-size="10">底面/反対側はさしがね（曲尺）で 90° に転写</text>
</svg>
