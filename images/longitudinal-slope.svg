<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" font-family="-apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="10">
  <text x="180" y="14" text-anchor="middle" font-weight="700" font-size="11" fill="#222">縦断方向 — 法面/勾配での設置例（側面図）</text>

  <!-- Sky -->
  <rect x="0" y="18" width="360" height="185" fill="#e6f1f7"/>

  <!--
    Ground: top flat → slope (~31°) → bottom flat
    Top flat: from (0,80) to (140,80)
    Slope: (140,80) → (290,170). Vector (150,90), unit (0.857, 0.514). Angle 30.97° below horizontal.
    Bottom flat: (290,170) → (360,170)
    Perp_up to slope: (0.514, -0.857)
  -->
  <path d="M0,80 L140,80 L290,170 L360,170 L360,203 L0,203 Z" fill="#d4b48c" stroke="#7a5a3a" stroke-width="1"/>
  <g stroke="#5a9c5a" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="79" x2="140" y2="79"/>
    <line x1="140" y1="79" x2="290" y2="169"/>
    <line x1="290" y1="169" x2="360" y2="169"/>
  </g>

  <!-- Horizontal gutter (top, sitting on flat ground) -->
  <polygon points="20,65 140,65 140,79 20,79" fill="#bcbcbc" stroke="#1a1a1a" stroke-width="0.8"/>
  <rect x="22" y="68" width="115" height="8" fill="#3a3a3a" opacity="0.55"/>

  <!--
    Sloped gutter sitting on slope surface (bottom edge on slope).
    Base bottom-left = (140,79), thickness 14, length 150 along slope.
    BL=(140,79)
    BR=(140+150*0.857, 79+150*0.514) = (268.55, 156.10)
    TL=(140+14*0.514, 79+14*-0.857) = (147.20, 67.00)
    TR=(268.55+14*0.514, 156.10+14*-0.857) = (275.75, 144.10)
  -->
  <polygon points="140,79 268.55,156.10 275.75,144.10 147.20,67.00" fill="#bcbcbc" stroke="#1a1a1a" stroke-width="0.8"/>
  <!-- channel (perp 3..11 of 14) -->
  <polygon points="141.54,76.43 270.09,153.53 274.20,146.67 145.65,69.57" fill="#3a3a3a" opacity="0.55"/>

  <!-- Miter cut at the joint (between top piece's right end and slope piece's top-left) -->
  <line x1="140" y1="65" x2="147.20" y2="67.00" stroke="#2c8c2c" stroke-width="2"/>

  <!--
    Slope angle θ marker (at slope start point on the ground)
    Center (140,80), radius 16
    Start: along horizontal right at (156, 80)
    End: along slope direction at (140+16*0.857, 80+16*0.514) = (153.71, 88.22)
    Arc: 31° going CW (down through slope), sweep=1
  -->
  <line x1="140" y1="80" x2="168" y2="80" stroke="#888" stroke-width="0.6" stroke-dasharray="2,2"/>
  <path d="M156,80 A16,16 0 0 1 153.71,88.22" fill="none" stroke="#cc2c2c" stroke-width="1.4"/>
  <text x="161" y="93" fill="#cc2c2c" font-weight="700" font-size="11">θ</text>

  <!-- Piece labels -->
  <text x="78" y="60" text-anchor="middle" fill="#222" font-size="10" font-weight="600">天端側ピース</text>
  <text x="220" y="118" text-anchor="middle" fill="#222" font-size="10" font-weight="600">法面側ピース</text>

  <!-- Bottom annotations -->
  <text x="180" y="180" text-anchor="middle" fill="#222" font-size="11" font-weight="700">勾配角 θ に合わせて両ピースを斜めにカット</text>
  <text x="180" y="195" text-anchor="middle" fill="#666" font-size="9">坂道・法面・縦排水で使用</text>
</svg>
